<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0288d1">
  <meta name="description" content="Islamische Feiertage und Hijri-Kalender mit gregorianischen Entsprechungen.">
  <title>Islamische Feiertage</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/img/icon-64.png" sizes="64x64">
  <link rel="apple-touch-icon" href="./assets/img/icon-180.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <script>
    try {
      var mode = localStorage.getItem('pt.theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body data-page="calendar">
  <a class="skip-link" href="#app-main" data-i18n="web.skipToContent">Zum Inhalt springen</a>

  <app-shell page="calendar" title-key="calendar">
    <div data-app-bar-actions>
      <button class="icon-btn" id="calendar-switch" type="button" data-i18n-aria-label="web.switchCalendar" aria-label="Kalender wechseln">
        <span data-icon="calendar-switch"></span>
      </button>
    </div>

    <main id="app-main">
      <div class="calendar-page">
        <div class="year-tabs" id="year-tabs" role="tablist" aria-label="Jahr"></div>
        <div class="calendar-list" id="calendar-list"></div>
      </div>
    </main>
  </app-shell>

  <script src="./js/vendor/htmx.min.js"></script>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/pages/calendar.js"></script>
</body>
</html>
