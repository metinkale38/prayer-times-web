<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0288d1">
  <meta name="description" content="Zähler für verpasste Gebete, Witr und Fasten.">
  <title>Verpasste Gebete</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/img/icon-64.png" sizes="64x64">
  <link rel="apple-touch-icon" href="./assets/img/icon-180.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <script>
    try {
      var mode = localStorage.getItem('pt.theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body data-page="missed">
  <a class="skip-link" href="#app-main" data-i18n="web.skipToContent">Zum Inhalt springen</a>

  <app-shell page="missed" title-key="missedPrayers">
    <main id="app-main">
      <div class="missed-page">
        <div class="missed-list" id="missed-list"></div>
        <p class="missed-updated" id="missed-updated" hidden></p>
        <p class="missed-hint" data-i18n="web.missedHint">Die Zähler werden automatisch gespeichert.</p>
      </div>
    </main>
  </app-shell>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/pages/missed.js"></script>
</body>
</html>
