<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0288d1">
  <meta name="description" content="Die 99 Namen Allahs mit arabischem Text, Transkription und Bedeutung.">
  <title>99 Namen Allah's</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/img/icon-64.png" sizes="64x64">
  <link rel="apple-touch-icon" href="./assets/img/icon-180.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <script>
    try {
      var mode = localStorage.getItem('pt.theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body data-page="names">
  <a class="skip-link" href="#app-main" data-i18n="web.skipToContent">Zum Inhalt springen</a>

  <app-shell page="names" title-key="names">
    <div data-app-bar-actions>
      <button class="icon-btn" id="names-search-toggle" type="button" data-i18n-aria-label="search" aria-label="Suchen">
        <span data-icon="search"></span>
      </button>
    </div>

    <main id="app-main">
      <div class="names-page">
        <div class="names-toolbar-search" id="names-search" hidden>
          <div class="names-search-row">
            <input class="input" id="names-query" type="search" autocomplete="off" data-i18n-placeholder="web.searchNames" placeholder="Namen durchsuchen">
            <button class="icon-btn icon-btn--dark" id="names-search-close" type="button" data-i18n-aria-label="web.close" aria-label="Schließen">
              <span data-icon="close"></span>
            </button>
          </div>
        </div>
        <div class="names-grid" id="names-grid"></div>
        <div class="names-empty" id="names-empty" hidden>
          <p data-i18n="web.noResults">Keine Treffer</p>
        </div>
      </div>
    </main>
  </app-shell>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/pages/names.js"></script>
</body>
</html>
