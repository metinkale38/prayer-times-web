<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0288d1">
  <meta name="description" content="Gebetszeiten, Qibla-Kompass, 99 Namen Allahs, Dhikr und islamische Feiertage.">
  <title>Gebetszeiten</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/img/icon-64.png" sizes="64x64">
  <link rel="apple-touch-icon" href="./assets/img/icon-180.png">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <script>
    try {
      var mode = localStorage.getItem('pt.theme') || 'system';
      var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body data-page="times">
  <a class="skip-link" href="#app-main" data-i18n="web.skipToContent">Zum Inhalt springen</a>

  <app-shell page="times" title-key="appName">
    <div data-app-bar-actions>
      <button class="icon-btn" id="action-add" type="button" data-i18n-aria-label="web.addCity" aria-label="Stadt hinzufügen">
        <span data-icon="add"></span>
      </button>
      <button class="icon-btn" id="action-more" type="button" hidden data-i18n-aria-label="web.more" aria-label="Mehr">
        <span data-icon="more"></span>
      </button>
    </div>

    <main id="app-main">
      <div class="times-page">
        <div class="times-holiday" id="holyday-banner" hidden></div>

        <div class="times-pager" id="times-pager" tabindex="0" role="region" data-i18n-aria-label="appName" aria-label="Gebetszeiten" data-i18n-aria-roledescription="web.carousel" aria-roledescription="Karussell">
          <section class="pager-slide city-list-slide" data-slide="cities" aria-label="Städte">
            <div class="city-list-head">
              <h2 data-i18n="cities">Städte</h2>
            </div>
            <div class="city-list" id="city-list"></div>
            <div id="city-list-empty" hidden></div>
          </section>
        </div>

        <button class="times-footer" id="times-footer" type="button" disabled aria-disabled="true">
          <span data-footer-label data-i18n="cities">Städte</span>
          <span class="times-footer__handle" aria-hidden="true"></span>
        </button>

        <button class="times-fab" id="times-fab" type="button" data-i18n-aria-label="web.addCity" aria-label="Stadt hinzufügen">
          <span data-icon="add"></span>
        </button>

        <div class="sr-only" id="pager-status" aria-live="polite"></div>
      </div>
    </main>
  </app-shell>

  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/pages/times.js"></script>
</body>
</html>
